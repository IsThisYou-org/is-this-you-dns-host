# Operator configuration. Mount this file at /opt/data/etc/config.yaml.
# A missing file is treated as empty and the process refuses to start until
# service_ns is set. The image copies this example into place on first boot
# when the file is absent. Unknown keys are rejected. Values are checked at
# startup and every problem is reported, one line per key. TSIG secrets may
# be inline or in tsig_secret_file. They are never read from a zone upload.
#
# Minimum log severity for the application and for gunicorn. Syslog names:
# debug, info, notice, warning, err, crit, alert, emerg. warn and error are
# accepted. Matching is case-insensitive. Production typically uses warning.
# log_level: info

service_ns:
  - ns1.example.net.
  - ns2.example.net.

catalog_zone: catalog.example.net.
catalog_rname: hostmaster.example.net.
# Base URL of a JSON DoH API. The client sends Accept: application/dns-json
# and the parameters name, type, do, rd, cd, and server. This must be that
# JSON API, not a binary DoH endpoint (application/dns-message).
resolver_base_url: https://api.isthisyou.org/

# Public HTTP is port 80. nginx's localhost listener is 127.0.0.1:8081.
# gunicorn listens on 127.0.0.1:8000. NSD listens on 0.0.0.0 port 53.
# Those addresses are fixed. Data is /opt/data. The ICANN trust-anchor
# file is /app/deploy/root-anchors.ds. Those paths are fixed.
# Also overridable with the GUNICORN_WORKERS environment variable.
gunicorn_workers: 3
axfr_children: 5
dnskey_cache_seconds: 3600

# Internal SOA (UDP) and AXFR (TCP) listen on 127.0.0.1 port 5353.
# That address is fixed. Localhost AXFR is always allowed.
# NSD on port 53 is the public server and transfers only the catalog
# zone from 127.0.0.1:5353.

# One list. provide-xfr and notify are generated from these entries.
# secondaries:
#   - ip: 192.0.2.10
#     port: 53
#     tsig_key_name: transfer.example.
#     tsig_secret_file: /opt/data/secrets/transfer.key
#     tsig_algo: hmac-sha256
secondaries: []

# Debugging AXFR clients, in addition to secondaries. Each entry is an
# IPv4 or IPv6 CIDR. A bare address is a /32 or /128. NSD emits
# provide-xfr for these networks (NOKEY). NOTIFY is still sent only to
# secondaries.
# axfr_allow:
#   - 192.0.2.0/24
#   - 2001:db8:1::/48
#   - 203.0.113.50
axfr_allow: []

# Set this to the TLS shedder network when using docker-compose.tls.yml.
# The easy-nginx overlay uses 172.28.9.0/24.
trusted_proxies: []

grace_days: 90
max_body_bytes: 1048576
max_rrsets: 2000
max_names: 1000
max_rdata_bytes: 4096
rate_limit_requests: 30
rate_limit_window_seconds: 60
parent_query_budget: 15
parent_query_window_seconds: 60
# YAML boolean (`true` or `false`). A quoted string or a number is rejected.
health_check_dns: true
